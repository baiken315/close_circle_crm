services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment:
      # Run in the user's local timezone so important-date "today" boundaries
      # and the day-before/same-day comparison use the local day, not UTC.
      # (UTC made the Aug-14 birthday fire at Aug 13 8pm EDT.)
      - TZ=America/New_York
    env_file: ./api/.env
    volumes:
      - duckdb_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8787/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  nginx:
    build:
      context: ./app
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - internal
    depends_on:
      api:
        condition: service_healthy

volumes:
  duckdb_data:

networks:
  internal:
